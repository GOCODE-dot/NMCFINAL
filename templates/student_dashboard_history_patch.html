<script>
function showTab(name) {
  const names = ['order','mealhistory','history','invite','account'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'mealhistory') loadMealHistory();
  if (name === 'invite') loadInvites();
  if (name === 'account') loadFloorStatus();
}
</script>


<!-- ══════════════════════════════════════════════════════════════════

<script>
// ── Meal History (last 30 days) ─────────────────────────────────────────────

let _mealHistoryLoaded = false;

async function loadMealHistory() {
  const body = document.getElementById('mealHistoryBody');
  body.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 0">
    <i class="fas fa-spinner fa-spin" style="font-size:22px;margin-bottom:10px;display:block"></i>Loading…</div>`;

  let data;
  try {
    const res = await fetch('/student/meal_history');
    data = await res.json();
  } catch (e) {
    body.innerHTML = `<div style="text-align:center;color:var(--danger);padding:32px 0">
      <i class="fas fa-exclamation-triangle"></i> Could not load history. Check your connection.
      <div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="loadMealHistory()"><i class="fas fa-sync-alt"></i> Retry</button></div>
    </div>`;
    return;
  }

  if (!data.ok) {
    body.innerHTML = `<div style="text-align:center;color:var(--danger);padding:32px 0">${data.msg || 'Failed to load history.'}</div>`;
    return;
  }

  _mealHistoryLoaded = true;
  const { orders, summary } = data;

  // Summary strip
  const summaryHtml = `
    <div class="mh-summary-strip">
      <div class="mh-summary-stat"><div class="mh-summary-n">${summary.total_meals}</div><div class="mh-summary-lbl">Meals Ordered</div></div>
      <div class="mh-summary-stat"><div class="mh-summary-n">৳${Math.round(summary.total_amount)}</div><div class="mh-summary-lbl">Total Value</div></div>
      <div class="mh-summary-stat"><div class="mh-summary-n" style="color:var(--primary)">৳${Math.round(summary.paid_amount)}</div><div class="mh-summary-lbl">Paid</div></div>
      <div class="mh-summary-stat"><div class="mh-summary-n" style="color:var(--danger)">৳${Math.round(summary.due_amount)}</div><div class="mh-summary-lbl">Due</div></div>
    </div>`;

  if (!orders || !orders.length) {
    body.innerHTML = summaryHtml + `
      <div style="text-align:center;color:var(--text-muted);padding:40px 0">
        <div style="font-size:40px;margin-bottom:12px">🍽️</div>
        <div>No meals ordered in the last 30 days.</div>
      </div>`;
    return;
  }

  // Group orders by meal_date, most recent date first (already ordered DESC from server)
  const groups = {};
  const dateOrder = [];
  orders.forEach(o => {
    if (!groups[o.meal_date]) { groups[o.meal_date] = []; dateOrder.push(o.meal_date); }
    groups[o.meal_date].push(o);
  });

  const fmtDate = ds => {
    const d = new Date(ds + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  };

  const statusLabel = { paid: 'Paid', pending: 'Pending', due: 'Due (overdue)' };

  const groupsHtml = dateOrder.map(ds => {
    const rows = groups[ds].map(o => `
      <div class="mh-row">
        <div class="mh-row-left">
          <div class="mh-meal-icon ${o.meal_type}"><i class="fas fa-${o.meal_type === 'lunch' ? 'sun' : 'moon'}"></i></div>
          <div class="mh-meal-name">${o.meal_type}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mh-amount">৳${Math.round(o.amount)}</span>
          <span class="mh-status-pill ${o.payment_status}">${statusLabel[o.payment_status] || o.payment_status}</span>
        </div>
      </div>`).join('');
    return `<div class="mh-day-group"><div class="mh-day-label">${fmtDate(ds)}</div>${rows}</div>`;
  }).join('');

  body.innerHTML = summaryHtml + groupsHtml;
}
</script>
